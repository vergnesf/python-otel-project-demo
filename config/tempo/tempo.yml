server:
  http_listen_port: 3200
  grpc_listen_port: 9097

distributor:
  receivers: # this configuration will listen on all ports and protocols that tempo is capable of.
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4319

metrics_generator:
  processor:
    service_graphs:
      histogram_buckets: [0.1, 0.2, 0.4, 0.8, 1.6, 3.2, 6.4, 12.8]
      dimensions:
        - job
        - service.name
        - service.namespace
        - service.instance.id
        - host
        - environment
        - net.k8s.name
        - net.peer.name
        - net.host.name
        - http.method
        - http.status_code
        - db.name
        - http.url
        - http.host
        - http.route
        - http.method
        - code.function
        - code.namespace
        - db.operation
        - db.sql.table
        - otel.library.version
    span_metrics:
      histogram_buckets:
        [
          0.002,
          0.004,
          0.008,
          0.016,
          0.032,
          0.064,
          0.128,
          0.256,
          0.512,
          1.02,
          2.05,
          4.10,
        ]
      dimensions:
        - job
        - service.name
        - service.namespace
        - service.instance.id
        - host
        - environment
        - net.k8s.name
        - net.peer.name
        - net.host.name
        - http.method
        - http.status_code
        - db.name
        - http.url
        - http.host
        - http.route
        - http.method
        - code.function
        - code.namespace
        - db.operation
        - db.sql.table
        - otel.library.version
      enable_target_info: false
  storage:
    path: /tmp/tempo/generator
    remote_write:
      - url: "http://mimir:9009/api/v1/push"
        send_exemplars: true

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics